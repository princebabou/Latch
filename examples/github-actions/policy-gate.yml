name: Latch policy gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  protected-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce deployment policy
        id: latch
        uses: princebabou/Latch@v0.2.0
        with:
          config: configs/latch.example.yaml
          agent: github-actions
          tool: deployment.apply
          operation: write
          resource: ${{ inputs.environment }}
          arguments: ${{ toJSON(inputs) }}

      # The action already exits non-zero for BLOCK and REQUIRE_APPROVAL. This
      # explicit condition makes the execution boundary visible to reviewers.
      - name: Deploy
        if: steps.latch.outputs.allowed == 'true'
        run: ./scripts/deploy.sh "${{ inputs.environment }}"
