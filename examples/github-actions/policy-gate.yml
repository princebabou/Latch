name: Latch policy gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.24.13
          cache: true
      - name: Evaluate deployment action
        run: |
          go run ./cmd/latch check \
            --config configs/latch.example.yaml \
            --agent github-actions \
            --tool deployment.apply \
            --action write \
            --arg environment=${{ inputs.environment }} \
            --json
