name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Security conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true
      - name: Certify built-in enforcement boundaries
        run: go run ./cmd/latch conformance --json

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath ./cmd/latch

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build supported targets
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            export GOOS="${target%/*}"
            export GOARCH="${target#*/}"
            go build -trimpath -o /tmp/latch-build ./cmd/latch
          done

  sdk-tests:
    name: SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python SDK with LangChain support
        run: python -m pip install -e './sdk/python[langchain]'
      - name: Run Python SDK tests
        env:
          PYTHONPATH: sdk/python/src
        run: python -m unittest discover -s sdk/python/tests -p 'test_*.py'
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm test

  github-action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.24.13
          cache: true
      - name: Build local Latch binary
        id: build_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/latch-ci"
          go build -trimpath -o "$RUNNER_TEMP/latch-ci/latch" ./cmd/latch
          echo "binary=$RUNNER_TEMP/latch-ci/latch" >> "$GITHUB_OUTPUT"
      - name: Build local Latch binary on Windows
        id: build_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "latch-ci"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $binary = Join-Path $directory "latch.exe"
          go build -trimpath -o $binary ./cmd/latch
          "binary=$binary" >> $env:GITHUB_OUTPUT
      - name: Enforce a deployment policy with the packaged action
        id: latch_gate
        uses: ./
        with:
          latch-binary: ${{ steps.build_unix.outputs.binary || steps.build_windows.outputs.binary }}
          config: configs/latch.example.yaml
          agent: github-actions
          tool: deployment.apply
          operation: write
          arguments: '{"environment":"staging"}'
      - name: Verify action outputs
        shell: bash
        env:
          LATCH_DECISION: ${{ steps.latch_gate.outputs.decision }}
          LATCH_ALLOWED: ${{ steps.latch_gate.outputs.allowed }}
        run: |
          test "$LATCH_DECISION" = "ALLOW"
          test "$LATCH_ALLOWED" = "true"

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build local container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: latch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: docker run --rm latch:ci version --json
