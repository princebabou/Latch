# Latch policy: explicit BLOCK rules always override approval and allow rules.
version: 1

enforcement:
  # Actions without a matching policy are escalated by deterministic risk score.
  approval_threshold: 40
  block_threshold: 90
  # Break-glass unsafe overrides are disabled unless explicitly enabled here.
  allow_unsafe_overrides: false

# For production MCP launchers, set require_verified to true and register
# per-agent capabilities as documented in the README.
identity:
  require_verified: false
  enforce_capabilities: false

# Cumulative per-agent budgets require verified identities. Add rules after
# enabling identity.require_verified, or use latch.identity.example.yaml.
budgets:
  store_path: .latch/budgets.json
  lock_timeout: 2s
  rules: []

approvals:
  store_path: .latch/approvals.json
  default_ttl: 15m
  max_ttl: 24h
  lock_timeout: 2s
  # Optional out-of-band alert when an action is held for approval. Delivery is
  # best-effort and never changes a verdict. Plain HTTP is only allowed to a
  # loopback host; every other destination must be HTTPS.
  # notify:
  #   webhook_url: https://hooks.slack.com/services/T000/B000/XXXX
  #   format: slack        # slack | generic (default generic)
  #   timeout: 3s

audit:
  path: .latch/audit.jsonl
  terminal: true

rules:
  - id: block-private-keys
    description: Private keys are never available to AI agents.
    priority: 100
    match:
      path:
        - "~/.ssh/**"
        - "**/*.pem"
        - "**/*.key"
    action: block

  - id: block-environment-files
    description: Environment files often contain unscoped credentials.
    priority: 100
    match:
      path:
        - "**/.env"
        - "**/.env.*"
    action: block

  - id: block-system-passwords
    description: Password hash files are prohibited.
    priority: 100
    match:
      path: "/etc/shadow"
    action: block

  - id: shell-needs-approval
    description: Shell execution requires a human decision.
    match:
      tool: shell.exec
    action: require_approval

  - id: production-write-needs-approval
    description: Production writes require explicit approval.
    match:
      action: write
      arguments:
        environment: production
    action: require_approval
